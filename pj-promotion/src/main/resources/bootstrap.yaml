server:
  port: 8086  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码

spring:
  profiles:
    active: dev
  application:
    name: promotion-service
  datasource:
    url: jdbc:mysql://192.168.150.120:3306/pj_promotion?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
  rabbitmq:
    host: 192.168.150.120
    port: 5672
    virtual-host: /hmall
    username: hmall
    password: 123
    listener:
      simple:
        prefetch: 1
  redis:
    host: 192.168.150.120
    port: 6379
    password: 1234

mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      logic-delete-field: deleted
      update-strategy: not_null
      id-type: assign_id

knife4j:
  enable: true
  openapi:
    title: 被窝学堂促销接口文档
    description: 被窝学堂促销接口文档
    email: pj995995995@163.com
    concat: lipengjie
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.pajamas.promotion.controller

logging:
  level:
    com.pajamas: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"

seata:
  application-id: promotion-service
  registry: # TC服务注册中心的配置，微服务根据这些信息去注册中心获取tc服务地址
    type: nacos # 注册中心类型 nacos
    nacos:
      server-addr: 192.168.150.120:8848 # nacos地址
      namespace: "" # namespace，默认为空
      group: DEFAULT_GROUP # 分组，默认是DEFAULT_GROUP
      application: seata-server # seata服务名称
      username: nacos
      password: nacos
  tx-service-group: study-in-pj # 事务组名称
  service:
    vgroup-mapping: # 事务组与tc集群的映射关系
      study-in-pj: "default"

feign:
  okhttp:
    enabled: true
pj:
  xxl-job:
    access-token: tianji
    admin:
      address: http://192.168.150.120:8880/xxl-job-admin
    executor:
      appname: learning-service
      log-retention-days: 10
      logPath: job/learning-service