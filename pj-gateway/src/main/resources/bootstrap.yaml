server:
  port: 10010  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - name: TokenRelay  # 这个过滤器是关键，负责传递 Bearer Token 和 Cookie

logging:
  level:
    com.pajamas: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"

pj:
  jwt:
    location: classpath:pj.jks
    alias: pj
    password: pj1234
    tokenTTL: 30m
    refreshTokenTTL: 4h
  auth:
    excludePaths:
      - /users/sign
      - /auth/login
      - /auth/refresh
      - /auth/logout