server:
  port: 10010  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: gateway-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/us/users/**
          filters:
            - StripPrefix=1
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/as/auth/**
          filters:
            - StripPrefix=1
            - name: TokenRelay       # 这个过滤器是关键，负责传递 Bearer Token 和 Cookie
        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=/cs/courses/**
          filters:
            - StripPrefix=1
        - id: exam-service
          uri: lb://exam-service
          predicates:
            - Path=/es/questions/**
          filters:
            - StripPrefix=1
        - id: trade-service
          uri: lb://trade-service
          predicates:
            - Path=/ts/**
          filters:
            - StripPrefix=1
        - id: promotion-service
          uri: lb://promotion-service
          predicates:
            - Path=/ps/**
          filters:
            - StripPrefix=1
pj:
  jwt:
    location: classpath:pj.jks
    alias: pj
    password: pj1234
    tokenTTL: 30m
    refreshTokenTTL: 4h
  auth:
    excludePaths:
      - /us/users/sign
      - /as/auth/login/**
      - /as/auth/refresh/**
      - /as/auth/logout/**
