server:
  port: 10011  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码

spring:
  profiles:
    active: dev
  application:
    name: auth-service
  redis:
    host: 192.168.150.120
    port: 6379
    password: 1234

mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      logic-delete-field: deleted
      update-strategy: not_null
      id-type: assign_id

knife4j:
  enable: true
  openapi:
    title: 被窝学堂认证接口文档
    description: 被窝学堂认证接口文档
    email: pj995995995@163.com
    concat: lipengjie
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.pajamas.auth.controller

logging:
  level:
    com.pajamas: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"

pj:
  jwt:
    location: classpath:pj.jks
    alias: pj
    password: pj1234
    accessTokenTTL: 30m
    refreshTokenTTl: 7d

feign:
  okhttp:
    enabled: true